<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nikkukyuu-code — カジュアルなネット対戦ゲーム</title>
<meta name="description" content="ネット対戦をカジュアルに楽しめるブラウザゲームを公開しているサイトです。7GET将棋、ハウスハウスなど。" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1273660625090851" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f6f1e8;
    --ink: #2b1c12;
    --accent: #8b2a2a;
    --gold: #c9a227;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.7;
  }
  header {
    padding: 48px 20px 28px;
    text-align: center;
    border-bottom: 1px solid #e2d3bc;
  }
  header p.kicker {
    margin: 0 0 8px;
    letter-spacing: 0.28em;
    font-size: 0.75rem;
    color: var(--accent);
  }
  h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; }
  .lead {
    max-width: 36em;
    margin: 14px auto 0;
    font-size: 1.02rem;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
  h2 {
    margin: 0 0 16px;
    font-size: 1.15rem;
    letter-spacing: 0.06em;
  }
  .games {
    display: grid;
    gap: 16px;
  }
  .card {
    background: #fffdf8;
    border: 1px solid #e2d3bc;
    border-radius: 16px;
    padding: 22px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 16px;
  }
  .card h3 { margin: 0; font-size: 1.25rem; }
  a.play {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 999px;
    letter-spacing: 0.06em;
  }
  .about {
    margin-top: 36px;
    font-size: 0.95rem;
  }
  footer {
    text-align: center;
    padding: 24px 20px 40px;
    font-size: 0.85rem;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <p class="kicker">NIKKUKYUU-CODE</p>
    <h1>ブラウザで気軽に対戦</h1>
    <p class="lead">ネット対戦をカジュアルに楽しめるゲームを公開しているサイトです。</p>
  </header>
  <main>
    <h2>公開中のゲーム</h2>
    <div class="games">
      <article class="card">
        <h3>7GET将棋</h3>
        <a class="play" href="./shogi/">遊ぶ</a>
      </article>
      <article class="card">
        <h3>ハウスハウス</h3>
        <a class="play" href="./househouse/">遊ぶ</a>
      </article>
    </div>
    <section class="about">
      <h2>このサイトについて</h2>
      <p>個人がブラウザ向けに制作したゲームの公開用ページです。「遊ぶ」から各ゲームの説明ページへ進み、そこから本体を開けます。</p>
    </section>
  </main>
  <footer>
    <a href="./privacy.html">プライバシーポリシー</a>
    ・
    <a href="mailto:nikkukyuu@gmail.com">お問い合わせ</a>
  </footer>
</body>
</html>
